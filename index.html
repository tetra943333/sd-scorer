
<style>

.nav-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);border:none;color:#fff;width:36px;height:52px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:4px;font-size:20px;z-index:2}

.verdict-btn{padding:12px;border-radius:var(--border-radius-md);border:1.5px solid var(--color-border-secondary);cursor:pointer;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--color-background-primary);color:var(--color-text-primary)}
.verdict-btn.ok.active{background:#EAF3DE;border-color:#3B6D11;color:#3B6D11}
.verdict-btn.ng.active{background:#FCEBEB;border-color:#A32D2D;color:#A32D2D}

.shortcut-hint{font-size:11px;color:var(--color-text-tertiary);text-align:center;margin-top:8px}
kbd{background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:4px;padding:1px 6px;font-family:var(--font-mono);font-size:11px}

.stat-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 10px;text-align:center}
.stat-card .val{font-size:18px;font-weight:500}

.reset-banner.show{display:flex}
.reset-banner i{font-size:15px;flex-shrink:0;margin-top:1px}

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Stable Diffusion プロンプト採点ツール v2</h2>

<div class="app">

    <button class="btn" id="btn-load-excel"><i class="ti ti-table" aria-hidden="true"></i>Excelを読み込む</button>
    <button class="btn btn-warn" id="btn-reset-all" style="display:none"><i class="ti ti-trash" aria-hidden="true"></i>全リセット</button>
    <button class="btn btn-primary" id="btn-save"><i class="ti ti-download" aria-hidden="true"></i>保存 <kbd style="color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.15)">S</kbd></button>
  </div>

  <div class="viewer" id="viewer">
    <div class="placeholder">
      <i class="ti ti-photo-off" aria-hidden="true"></i>

    </div>
    <button class="nav-btn nav-prev" id="nav-prev" style="display:none"><i class="ti ti-chevron-left"></i></button>

  </div>

  <div class="sidebar">
    <div class="sidebar-section">

    </div>
    <div class="sidebar-section">
      <div class="label">バッチカウント（1プロンプトあたりの枚数）</div>
      <div class="batch-btns" id="batch-btns">
        <button class="batch-btn active" data-val="1">1</button>
        <button class="batch-btn" data-val="2">2</button>
        <button class="batch-btn" data-val="4">4</button>
        <button class="batch-btn" data-val="8">8</button>
        <button class="batch-btn" data-val="16">16</button>
      </div>

        <div>
          <strong>前に戻りました</strong><br>
          ここから採点すると、この画像以降のスコアがリセットされます。
          <div style="margin-top:6px;display:flex;gap:6px">
            <button class="btn btn-warn" id="btn-confirm-reset" style="font-size:12px;padding:4px 10px"><i class="ti ti-trash" aria-hidden="true"></i>リセットして採点</button>
            <button class="btn" id="btn-cancel-reset" style="font-size:12px;padding:4px 10px">キャンセル</button>

      <div class="verdict-row">
        <button class="verdict-btn ok" id="btn-ok"><i class="ti ti-circle-check" aria-hidden="true"></i>OK</button>

    <div class="sidebar-section" style="flex:1;overflow-y:auto">
      <div class="label">採点済みリスト</div>

    </div>
    <div class="sidebar-section">
      <div class="stats-grid">
        <div class="stat-card"><div class="val" id="stat-total">0</div><div class="lbl">総画像数</div></div>
        <div class="stat-card"><div class="val" id="stat-scored">0</div><div class="lbl">採点済み</div></div>

  <div class="bottombar">

    <span class="status" id="status-msg">ファイルを読み込んでください</span>

<input type="file" id="zip-input" accept=".zip" style="display:none">
<input type="file" id="excel-input" accept=".xlsx,.xls,.csv" style="display:none">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const STORE_KEY = 'sd_scorer_v2';
const $ = id => document.getElementById(id);

const state = {
  images: [],
  current: 0,
  prompts: {},
  scores: {},
  batchCount: 1,
  zipName: '',
  pendingReset: false
};

function saveToStorage() {
  try {
    const data = {
      scores: state.scores,
      batchCount: state.batchCount,
      current: state.current,
      zipName: state.zipName,
      imageNames: state.images.map(i => i.name),
      prompts: state.prompts
    };
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
    const dot = $('autosave-dot');
    dot.classList.add('show');
    const now = new Date();
    $('autosave-time').textContent = `自動保存: ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
    setTimeout(() => dot.classList.remove('show'), 1500);
  } catch(e) {}
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

function restoreSession(saved) {
  if (!saved || !state.images.length) return;
  const namesMatch = saved.imageNames && saved.imageNames.length === state.images.length &&
    saved.imageNames.every((n,i) => n === state.images[i].name);
  if (!namesMatch) return;
  state.scores = saved.scores || {};
  state.prompts = Object.keys(state.prompts).length ? state.prompts : (saved.prompts || {});
  state.batchCount = saved.batchCount || 1;
  document.querySelectorAll('.batch-btn').forEach(b => {
    b.classList.toggle('active', +b.dataset.val === state.batchCount);
  });
  const firstUnscored = state.images.findIndex((_, i) => !state.scores[i]);
  state.current = firstUnscored >= 0 ? firstUnscored : state.images.length - 1;
  setStatus(`前回の続きから再開しました（${Object.keys(state.scores).length}件採点済み）`);
}

function getFirstScoredAfter(idx) {
  for (let i = idx; i < state.images.length; i++) {
    if (state.scores[i] !== undefined) return i;
  }
  return -1;
}

function checkResetNeeded(verdict) {
  if (!verdict) return false;
  const firstAfter = getFirstScoredAfter(state.current + 1);
  return firstAfter >= 0;
}

function resetFrom(idx) {
  for (let i = idx; i < state.images.length; i++) {
    delete state.scores[i];
  }
  state.pendingReset = false;
  hideBanner();
  saveToStorage();
  updateAll();
}

function showBanner() { $('reset-banner').classList.add('show'); }
function hideBanner() { $('reset-banner').classList.remove('show'); }

function setScore(verdict) {
  if (!state.images.length) return;
  if (checkResetNeeded(verdict) && !state.pendingReset) {
    state.pendingReset = true;
    showBanner();
    $('btn-ok').classList.toggle('active', verdict === 'ok');
    $('btn-ng').classList.toggle('active', verdict === 'ng');
    $('btn-confirm-reset').onclick = () => {
      resetFrom(state.current);
      applyScore(verdict);
    };
    return;
  }
  applyScore(verdict);
}

function applyScore(verdict) {
  state.pendingReset = false;
  hideBanner();
  state.scores[state.current] = verdict;
  saveToStorage();
  updateAll();
  setTimeout(() => navigate(1), 180);
}

function navigate(dir) {
  if (!state.images.length) return;
  const next = Math.max(0, Math.min(state.images.length - 1, state.current + dir));
  if (next === state.current) return;
  state.pendingReset = false;
  hideBanner();
  state.current = next;
  updateAll();
}

function updateViewer() {
  const viewer = $('viewer');
  const prev = $('nav-prev'), next = $('nav-next'), counter = $('img-counter');
  if (!state.images.length) {
    viewer.innerHTML = '<div class="placeholder"><i class="ti ti-photo-off" aria-hidden="true"></i>ZIPファイルを読み込んでください</div>';
    viewer.appendChild(prev); viewer.appendChild(next); viewer.appendChild(counter);
    prev.style.display = next.style.display = counter.style.display = 'none';
    return;
  }
  const img = state.images[state.current];
  let el = viewer.querySelector('img');
  if (!el) {
    viewer.innerHTML = '';
    viewer.appendChild(prev);
    el = document.createElement('img');
    viewer.appendChild(el);
    viewer.appendChild(counter);
    viewer.appendChild(next);
  }
  el.src = img.url;
  el.alt = img.name;
  const scored = state.scores[state.current];
  const badge = scored === 'ok' ? ' ✓OK' : scored === 'ng' ? ' ✗NG' : '';
  counter.textContent = `${state.current + 1} / ${state.images.length}　${img.name}${badge}`;
  counter.style.display = 'block';
  prev.style.display = 'flex'; next.style.display = 'flex';
}

function updateSidebar() {
  if (!state.images.length) return;
  const idx = state.current;
  const img = state.images[idx];
  const pd = $('prompt-display');
  const p = state.prompts[idx + 1] || state.prompts[img.name];
  if (p) { pd.textContent = p; pd.classList.remove('empty'); }
  else { pd.textContent = 'プロンプトが見つかりません'; pd.classList.add('empty'); }
  const score = state.scores[idx];
  $('btn-ok').classList.toggle('active', score === 'ok');
  $('btn-ng').classList.toggle('active', score === 'ng');
}

function updateStats() {
  const total = state.images.length;
  const entries = Object.values(state.scores);
  const scored = entries.length;
  const ng = entries.filter(v => v === 'ng').length;
  $('stat-total').textContent = total;
  $('stat-scored').textContent = scored;
  $('stat-ng-pct').textContent = scored > 0 ? Math.round(ng / scored * 100) + '%' : '-';
}

function updateResultsTable() {
  const area = $('results-area');
  const entries = Object.entries(state.scores);
  if (!entries.length) { area.innerHTML = '<div style="font-size:12px;color:var(--color-text-tertiary)">まだ採点されていません</div>'; return; }
  const rows = entries.sort((a,b) => +a[0] - +b[0]).map(([i, v]) => {
    const img = state.images[+i];
    const idx = +i + 1;
    const p = state.prompts[idx] || state.prompts[img?.name] || '-';
    const short = p.length > 55 ? p.slice(0, 55) + '…' : p;
    const cur = +i === state.current ? 'style="background:var(--color-background-info)"' : '';
    const tag = v === 'ok' ? '<span class="tag-ok">OK</span>' : '<span class="tag-ng">NG</span>';
    return `<tr ${cur}><td style="color:var(--color-text-secondary);min-width:26px">#${idx}</td><td style="max-width:170px">${short}</td><td>${tag}</td></tr>`;
  }).join('');
  area.innerHTML = `<table class="results-table"><thead><tr><th>#</th><th>プロンプト</th><th>結果</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function updateAll() { updateViewer(); updateSidebar(); updateStats(); updateResultsTable(); }

function setStatus(msg) { $('status-msg').textContent = msg; }

function saveResults() {
  if (!Object.keys(state.scores).length) { setStatus('採点データがありません'); return; }
  const grouped = {};
  Object.entries(state.scores).forEach(([i, v]) => {
    const imgIdx = +i;
    const img = state.images[imgIdx];
    const promptIdx = imgIdx + 1;
    const p = state.prompts[promptIdx] || state.prompts[img?.name] || '';
    const grp = Math.floor(imgIdx / state.batchCount);
    if (!grouped[grp]) grouped[grp] = { seq: grp + 1, prompt: p, total: 0, ng: 0 };
    grouped[grp].total++;
    if (v === 'ng') grouped[grp].ng++;
  });
  const rows = [['#', 'プロンプト', 'NG率', 'NG数', '総数']];
  Object.values(grouped).sort((a,b) => a.seq - b.seq).forEach(g => {
    rows.push([g.seq, g.prompt, g.total > 0 ? Math.round(g.ng / g.total * 100) + '%' : '-', g.ng, g.total]);
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:4},{wch:60},{wch:8},{wch:6},{wch:6}];
  XLSX.utils.book_append_sheet(wb, ws, '採点結果');
  const fname = (state.zipName || 'results').replace(/\.zip$/i,'') + '_scores.xlsx';
  XLSX.writeFile(wb, fname);
  setStatus(`保存: ${fname}`);
}

$('btn-load-zip').onclick = () => $('zip-input').click();
$('zip-input').onchange = async function() {
  const file = this.files[0]; if (!file) return;
  setStatus('ZIPを読み込み中...');
  state.zipName = file.name;
  state.images.forEach(i => URL.revokeObjectURL(i.url));
  state.images = []; state.scores = {}; state.current = 0; state.pendingReset = false; hideBanner();
  try {
    const zip = await JSZip.loadAsync(file);
    const imgExts = /\.(png|jpe?g|gif|webp)$/i;
    const files = Object.values(zip.files).filter(f => !f.dir && imgExts.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    for (const f of files) {
      const blob = await f.async('blob');
      state.images.push({ name: f.name.split('/').pop(), url: URL.createObjectURL(blob) });
    }
    if (!state.images.length) { setStatus('ZIP内に画像が見つかりませんでした'); return; }
    $('btn-reset-all').style.display = 'inline-flex';
    const saved = loadFromStorage();
    restoreSession(saved);
    updateAll();
    if (!saved || !saved.imageNames || saved.imageNames[0] !== state.images[0]?.name) {
      setStatus(`${state.images.length}枚の画像を読み込みました`);
    }
  } catch(e) { setStatus('ZIPの読み込みに失敗しました: ' + e.message); }
  this.value = '';
};

$('btn-load-excel').onclick = () => $('excel-input').click();
$('excel-input').onchange = function() {
  const file = this.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, {header:1});
      state.prompts = {};
      data.forEach(row => { if (row[0] !== undefined && row[1] !== undefined) state.prompts[row[0]] = String(row[1]); });
      setStatus(`${Object.keys(state.prompts).length}件のプロンプトを読み込みました`);
      saveToStorage();
      updateAll();
    } catch(ex) { setStatus('Excel読み込みエラー: ' + ex.message); }
  };
  reader.readAsArrayBuffer(file);
  this.value = '';
};

$('btn-ok').onclick = () => setScore('ok');
$('btn-ng').onclick = () => setScore('ng');
$('btn-save').onclick = saveResults;
$('nav-prev').onclick = () => navigate(-1);
$('nav-next').onclick = () => navigate(1);
$('btn-cancel-reset').onclick = () => { state.pendingReset = false; hideBanner(); updateSidebar(); };
$('btn-reset-all').onclick = () => {
  if (confirm('全ての採点データをリセットしますか？')) {
    state.scores = {}; state.current = 0; state.pendingReset = false; hideBanner();
    localStorage.removeItem(STORE_KEY);
    setStatus('全リセットしました');
    updateAll();
  }
};

document.querySelectorAll('.batch-btn').forEach(btn => {
  btn.onclick = function() {
    document.querySelectorAll('.batch-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    state.batchCount = +this.dataset.val;
    saveToStorage();
  };
});

document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)) return;
  switch(e.key.toLowerCase()) {
    case 'o': setScore('ok'); break;
    case 'n': case 'x': setScore('ng'); break;
    case 'arrowleft': navigate(-1); break;
    case 'arrowright': navigate(1); break;
    case 's': if (e.metaKey||e.ctrlKey){e.preventDefault();saveResults();} break;
  }
});
