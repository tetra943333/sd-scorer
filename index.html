  <!DOCTYPE html>
  <html lang="ja">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SD プロンプト採点</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
  <style>
  :root {
    --bg: #0f0f11;
    --bg2: #18181c;
    --bg3: #222228;
    --border: rgba(255,255,255,.08);
    --text: #e8e8ec;
    --text2: #888896;
    --text3: #555562;
    --ok: #4ade80;
    --ok-bg: rgba(74,222,128,.12);
    --ok-border: rgba(74,222,128,.35);
    --ng: #f87171;
    --ng-bg: rgba(248,113,113,.12);
    --ng-border: rgba(248,113,113,.35);
    --accent: #7c6fe0;
    --accent2: #a78bfa;
    --warn: #f59e0b;
    --radius: 10px;
    --radius-sm: 6px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

  /* ===== LAYOUT ===== */
  .app{display:grid;grid-template-rows:48px 1fr 44px;height:100vh;height:100dvh}
  .topbar{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
  .topbar::-webkit-scrollbar{display:none}
  .topbar h1{font-size:14px;font-weight:600;white-space:nowrap;margin-right:4px;background:linear-gradient(135deg,var(--accent2),#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .main{display:grid;grid-template-columns:1fr 300px;overflow:hidden}
  .bottombar{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--bg2);border-top:1px solid var(--border)}

  /* ===== BUTTONS ===== */
  .btn{padding:6px 12px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg3);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-family:inherit;transition:all .15s}
  .btn:hover,.btn:active{background:rgba(255,255,255,.08)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#5b8dee);border-color:transparent;color:#fff}
  .btn-primary:hover{opacity:.9}
  .btn-warn{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4);color:var(--warn)}

  /* ===== VIEWER ===== */
  .viewer{position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
  .viewer img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .placeholder{color:var(--text3);font-size:13px;text-align:center;padding:20px}
  .placeholder .ti{font-size:40px;display:block;margin-bottom:8px;opacity:.3}
  .nav-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);color:var(--text);width:36px;height:52px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:var(--radius-sm);font-size:20px;z-index:2;transition:background .15s}
  .nav-btn:hover,.nav-btn:active{background:rgba(0,0,0,.9)}
  .nav-prev{left:8px}
  .nav-next{right:8px}
  .img-counter{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:3px 10px;border-radius:20px;white-space:nowrap;backdrop-filter:blur(4px)}
  .score-badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;letter-spacing:.03em}
  .score-badge.ok{background:var(--ok-bg);border:1px solid var(--ok-border);color:var(--ok)}
  .score-badge.ng{background:var(--ng-bg);border:1px solid var(--ng-border);color:var(--ng)}

  /* ===== SIDEBAR ===== */
  .sidebar{background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .section{padding:12px 14px;border-bottom:1px solid var(--border)}
  .label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;font-weight:600}
  .prompt-box{font-size:11px;line-height:1.65;color:var(--text2);background:var(--bg3);border-radius:var(--radius-sm);padding:9px;max-height:90px;overflow-y:auto;word-break:break-word;border:1px solid var(--border)}
  .prompt-box.empty{color:var(--text3);font-style:italic}
  .batch-btns{display:flex;gap:6px;flex-wrap:wrap}
  .batch-btn{width:40px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);font-family:inherit;transition:all .15s}
  .batch-btn.active{background:linear-gradient(135deg,var(--accent),#5b8dee);border-color:transparent;color:#fff}
  .verdict-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .verdict-btn{padding:13px;border-radius:var(--radius);border:1.5px solid var(--border);cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bg3);color:var(--text2);font-family:inherit;transition:all .15s}
  .verdict-btn.ok.active{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok)}
  .verdict-btn.ng.active{background:var(--ng-bg);border-color:var(--ng-border);color:var(--ng)}
  .shortcut-hint{font-size:10px;color:var(--text3);text-align:center;margin-top:7px}
  kbd{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:monospace;font-size:10px;color:var(--text2)}

  /* ===== RESET BANNER ===== */
  .reset-banner{display:none;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:var(--radius-sm);padding:10px 12px;font-size:11px;color:var(--warn);gap:7px;align-items:flex-start;margin-bottom:10px}
  .reset-banner.show{display:flex}
  .reset-banner-btns{display:flex;gap:6px;margin-top:7px}

  /* ===== STATS ===== */
  .stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .stat-card{background:var(--bg3);border-radius:var(--radius-sm);padding:7px 8px;text-align:center;border:1px solid var(--border)}
  .stat-val{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent2),#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .stat-lbl{font-size:10px;color:var(--text3);margin-top:1px}

  /* ===== RESULTS TABLE ===== */
  .results-wrap{flex:1;overflow-y:auto}
  .rtable{width:100%;border-collapse:collapse;font-size:11px}
  .rtable th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);color:var(--text3);font-weight:500;position:sticky;top:0;background:var(--bg2)}
  .rtable td{padding:4px 8px;border-bottom:1px solid var(--border);vertical-align:top;word-break:break-word}
  .rtable tr.current td{background:rgba(124,111,224,.08)}
  .tag-ok{color:var(--ok);background:var(--ok-bg);padding:1px 7px;border-radius:20px;font-size:10px;border:1px solid var(--ok-border)}
  .tag-ng{color:var(--ng);background:var(--ng-bg);padding:1px 7px;border-radius:20px;font-size:10px;border:1px solid var(--ng-border)}

  /* ===== AUTOSAVE ===== */
  .autosave-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;opacity:0;transition:opacity .3s;flex-shrink:0}
  .autosave-dot.show{opacity:1}
  .status{flex:1;font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .save-time{font-size:10px;color:var(--text3);white-space:nowrap}

  /* ===== MOBILE ===== */
  @media (max-width: 640px) {
    .app{grid-template-rows:44px 1fr auto 44px}
    .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
    .sidebar{border-left:none;border-top:1px solid var(--border);max-height:55vh;overflow-y:auto}
    .viewer{min-height:180px}
    .prompt-box{max-height:70px}
    .results-wrap{max-height:120px}
    .section{padding:9px 12px}
    .batch-btn{width:36px;height:30px;font-size:12px}
    .verdict-btn{padding:14px 8px;font-size:15px}
    .shortcut-hint{display:none}
    .hide-mobile{display:none}
    kbd{display:none}
    .topbar h1{font-size:13px}
    .btn{padding:5px 9px;font-size:11px}
  }
  </style>
  </head>
  <body>
  <div class="app">

    <!-- TOPBAR -->
    <div class="topbar">
      <h1>✦ SD採点</h1>
      <button class="btn" id="btn-load-zip"><i class="ti ti-file-zip"></i>ZIP</button>
      <button class="btn" id="btn-load-excel"><i class="ti ti-table"></i>Excel</button>
      <button class="btn btn-warn hide-mobile" id="btn-reset-all" style="display:none"><i class="ti ti-trash"></i>リセット</button>
      <button class="btn btn-primary" id="btn-save"><i class="ti ti-download"></i>保存</button>
    </div>

    <!-- MAIN -->
    <div class="main">

      <!-- VIEWER -->
      <div class="viewer" id="viewer">
        <div class="placeholder">
          <span class="ti ti-photo-off"></span>
          ZIPファイルを読み込んでください
        </div>
        <button class="nav-btn nav-prev" id="nav-prev" style="display:none"><i class="ti ti-chevron-left"></i></button>
        <button class="nav-btn nav-next" id="nav-next" style="display:none"><i class="ti ti-chevron-right"></i></button>
        <div class="img-counter" id="img-counter" style="display:none"></div>
      </div>

      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="section">
          <div class="label">プロンプト</div>
          <div class="prompt-box empty" id="prompt-display">画像を読み込むと表示されます</div>
        </div>

        <div class="section">
          <div class="label">バッチカウント</div>
          <div class="batch-btns">
            <button class="batch-btn active" data-val="1">1</button>
            <button class="batch-btn" data-val="2">2</button>
            <button class="batch-btn" data-val="4">4</button>
            <button class="batch-btn" data-val="8">8</button>
            <button class="batch-btn" data-val="16">16</button>
          </div>
        </div>

        <div class="section">
          <div class="reset-banner" id="reset-banner">
            <i class="ti ti-alert-triangle" style="font-size:14px;flex-shrink:0;margin-top:1px"></i>
            <div>
              前に戻りました。採点するとこの画像以降のスコアがリセットされます。
              <div class="reset-banner-btns">
                <button class="btn btn-warn" id="btn-confirm-reset" style="font-size:11px;padding:4px 9px"><i class="ti ti-trash"></i>リセットして採点</button>
                <button class="btn" id="btn-cancel-reset" style="font-size:11px;padding:4px 9px">キャンセル</button>
              </div>
            </div>
          </div>
          <div class="label">採点</div>
          <div class="verdict-row">
            <button class="verdict-btn ok" id="btn-ok"><i class="ti ti-circle-check"></i>OK</button>
            <button class="verdict-btn ng" id="btn-ng"><i class="ti ti-circle-x"></i>NG</button>
          </div>
          <div class="shortcut-hint">
            <kbd>O</kbd> OK　<kbd>N</kbd>/<kbd>X</kbd> NG　<kbd>←</kbd><kbd>→</kbd> 移動のみ　<kbd>Ctrl+S</kbd> 保存
          </div>
        </div>

        <div class="section" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
          <div class="label">採点済みリスト</div>
          <div class="results-wrap">
            <div id="results-area" style="font-size:11px;color:var(--text3)">まだ採点されていません</div>
          </div>
        </div>

        <div class="section">
          <div class="stats-grid">
            <div class="stat-card"><div class="stat-val" id="stat-total">0</div><div class="stat-lbl">総画像数</div></div>
            <div class="stat-card"><div class="stat-val" id="stat-scored">0</div><div class="stat-lbl">採点済み</div></div>
            <div class="stat-card"><div class="stat-val" id="stat-ng-pct">-</div><div class="stat-lbl">NG率</div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTTOMBAR -->
    <div class="bottombar">
      <span class="autosave-dot" id="autosave-dot"></span>
      <span class="status" id="status-msg">ファイルを読み込んでください</span>
      <span class="save-time" id="autosave-time"></span>
    </div>
  </div>

  <input type="file" id="zip-input" accept=".zip" style="display:none">
  <input type="file" id="excel-input" accept=".xlsx,.xls,.csv" style="display:none">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
  'use strict';
  const STORE_KEY = 'sd_scorer_v3';
  const $ = id => document.getElementById(id);

  const state = {
    images: [], current: 0, prompts: {}, scores: {},
    batchCount: 1, zipName: '', pendingReset: false
  };

  /* ---- LocalStorage ---- */
  function saveToStorage() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        scores: state.scores, batchCount: state.batchCount,
        current: state.current, zipName: state.zipName,
        imageNames: state.images.map(i => i.name),
        prompts: state.prompts
      }));
      const dot = $('autosave-dot');
      dot.classList.add('show');
      const t = new Date();
      $('autosave-time').textContent =
        `自動保存 ${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}:${t.getSeconds().toString().padStart(2,'0')}`;
      setTimeout(() => dot.classList.remove('show'), 1800);
    } catch(e) {}
  }

  function loadFromStorage() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e) { return null; }
  }

  function restoreSession(saved) {
    if (!saved || !state.images.length) return false;
    const match = saved.imageNames && saved.imageNames.length === state.images.length &&
      saved.imageNames.every((n,i) => n === state.images[i].name);
    if (!match) return false;
    state.scores = saved.scores || {};
    if (!Object.keys(state.prompts).length && saved.prompts) state.prompts = saved.prompts;
    state.batchCount = saved.batchCount || 1;
    document.querySelectorAll('.batch-btn').forEach(b =>
      b.classList.toggle('active', +b.dataset.val === state.batchCount));
    const firstUnscored = state.images.findIndex((_,i) => state.scores[i] === undefined);
    state.current = firstUnscored >= 0 ? firstUnscored : state.images.length - 1;
    setStatus(`前回の続きから再開 (${Object.keys(state.scores).length}件採点済み)`);
    return true;
  }

  /* ---- Score Logic ---- */
  function hasScoreAfter(idx) {
    for (let i = idx + 1; i < state.images.length; i++) {
      if (state.scores[i] !== undefined) return true;
    }
    return false;
  }

  function setScore(verdict) {
    if (!state.images.length) return;
    if (hasScoreAfter(state.current) && !state.pendingReset) {
      state.pendingReset = true;
      showBanner();
      $('btn-ok').classList.toggle('active', verdict === 'ok');
      $('btn-ng').classList.toggle('active', verdict === 'ng');
      $('btn-confirm-reset').onclick = () => { resetFrom(state.current); applyScore(verdict); };
      return;
    }
    applyScore(verdict);
  }

  function applyScore(verdict) {
    state.pendingReset = false;
    hideBanner();
    state.scores[state.current] = verdict;
    saveToStorage();
    updateAll();
    setTimeout(() => navigate(1), 200);
  }

  function resetFrom(idx) {
    for (let i = idx; i < state.images.length; i++) delete state.scores[i];
    state.pendingReset = false;
    hideBanner();
    saveToStorage();
    updateAll();
  }

  function navigate(dir) {
    if (!state.images.length) return;
    const next = Math.max(0, Math.min(state.images.length - 1, state.current + dir));
    if (next === state.current) return;
    state.pendingReset = false;
    hideBanner();
    state.current = next;
    updateAll();
  }

  function showBanner() { $('reset-banner').classList.add('show'); }
  function hideBanner() { $('reset-banner').classList.remove('show'); }

  /* ---- Render ---- */
  function updateViewer() {
    const viewer = $('viewer');
    const prev = $('nav-prev'), next = $('nav-next'), counter = $('img-counter');
    if (!state.images.length) {
      viewer.innerHTML = '<div class="placeholder"><span class="ti ti-photo-off"></span>ZIPファイルを読み込んでください</div>';
      viewer.appendChild(prev); viewer.appendChild(next); viewer.appendChild(counter);
      prev.style.display = next.style.display = counter.style.display = 'none';
      return;
    }
    let el = viewer.querySelector('img');
    if (!el) {
      viewer.innerHTML = '';
      viewer.appendChild(prev);
      el = document.createElement('img');
      viewer.appendChild(el);
      viewer.appendChild(counter);
      viewer.appendChild(next);
    }
    // remove old badge
    const oldBadge = viewer.querySelector('.score-badge');
    if (oldBadge) oldBadge.remove();

    const img = state.images[state.current];
    el.src = img.url;
    el.alt = img.name;

    const score = state.scores[state.current];
    if (score) {
      const badge = document.createElement('div');
      badge.className = `score-badge ${score}`;
      badge.textContent = score.toUpperCase();
      viewer.appendChild(badge);
    }

    counter.textContent = `${state.current + 1} / ${state.images.length}　${img.name}`;
    counter.style.display = 'block';
    prev.style.display = next.style.display = 'flex';
  }

  function updateSidebar() {
    if (!state.images.length) return;
    const idx = state.current;
    const img = state.images[idx];
    const pd = $('prompt-display');
    const p = state.prompts[idx + 1] || state.prompts[img.name];
    if (p) { pd.textContent = p; pd.classList.remove('empty'); }
    else { pd.textContent = 'プロンプトが見つかりません'; pd.classList.add('empty'); }
    const score = state.scores[idx];
    $('btn-ok').classList.toggle('active', score === 'ok');
    $('btn-ng').classList.toggle('active', score === 'ng');
  }

  function updateStats() {
    const total = state.images.length;
    const entries = Object.values(state.scores);
    const ng = entries.filter(v => v === 'ng').length;
    $('stat-total').textContent = total;
    $('stat-scored').textContent = entries.length;
    $('stat-ng-pct').textContent = entries.length > 0 ? Math.round(ng / entries.length * 100) + '%' : '-';
  }

  function updateResultsTable() {
    const area = $('results-area');
    const entries = Object.entries(state.scores);
    if (!entries.length) {
      area.innerHTML = '<div style="color:var(--text3);font-size:11px">まだ採点されていません</div>';
      return;
    }
    const rows = entries.sort((a,b) => +a[0] - +b[0]).map(([i, v]) => {
      const img = state.images[+i];
      const idx = +i + 1;
      const p = state.prompts[idx] || state.prompts[img?.name] || '-';
      const short = p.length > 50 ? p.slice(0, 50) + '…' : p;
      const isCurrent = +i === state.current ? 'current' : '';
      const tag = v === 'ok' ? '<span class="tag-ok">OK</span>' : '<span class="tag-ng">NG</span>';
      return `<tr class="${isCurrent}"><td style="color:var(--text3);min-width:24px">#${idx}</td><td style="max-width:160px">${short}</td><td>${tag}</td></tr>`;
    }).join('');
    area.innerHTML = `<table class="rtable"><thead><tr><th>#</th><th>プロンプト</th><th>結果</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function updateAll() { updateViewer(); updateSidebar(); updateStats(); updateResultsTable(); }
  function setStatus(msg) { $('status-msg').textContent = msg; }

  /* ---- Save Excel (BOM付き UTF-8 対応) ---- */
  function saveResults() {
    if (!Object.keys(state.scores).length) { setStatus('採点データがありません'); return; }
    const grouped = {};
    Object.entries(state.scores).forEach(([i, v]) => {
      const imgIdx = +i;
      const img = state.images[imgIdx];
      const p = state.prompts[imgIdx + 1] || state.prompts[img?.name] || '';
      const grp = Math.floor(imgIdx / state.batchCount);
      if (!grouped[grp]) grouped[grp] = { seq: grp + 1, prompt: p, total: 0, ng: 0 };
      grouped[grp].total++;
      if (v === 'ng') grouped[grp].ng++;
    });
    const rows = [['#', 'プロンプト', 'NG率', 'NG数', '総数']];
    Object.values(grouped).sort((a,b) => a.seq - b.seq).forEach(g => {
      rows.push([g.seq, g.prompt, g.total > 0 ? Math.round(g.ng / g.total * 100) + '%' : '-', g.ng, g.total]);
    });
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:4},{wch:60},{wch:8},{wch:6},{wch:6}];
    // セルスタイル（ヘッダー行）
    XLSX.utils.book_append_sheet(wb, ws, '採点結果');
    // UTF-8 BOM付きで書き出し → Excelで文字化けしない
    const fname = (state.zipName || 'results').replace(/\.zip$/i,'') + '_scores.xlsx';
    XLSX.writeFile(wb, fname, { bookType: 'xlsx', type: 'binary' });
    setStatus('保存しました: ' + fname);
  }

  /* ---- File Inputs ---- */
  $('btn-load-zip').onclick = () => $('zip-input').click();
  $('zip-input').onchange = async function() {
    const file = this.files[0]; if (!file) return;
    setStatus('ZIPを読み込み中...');
    state.zipName = file.name;
    state.images.forEach(i => URL.revokeObjectURL(i.url));
    state.images = []; state.scores = {}; state.current = 0;
    state.pendingReset = false; hideBanner();
    try {
      const zip = await JSZip.loadAsync(file);
      const imgExts = /\.(png|jpe?g|gif|webp)$/i;
      const files = Object.values(zip.files)
        .filter(f => !f.dir && imgExts.test(f.name))
        .sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true}));
      for (const f of files) {
        const blob = await f.async('blob');
        state.images.push({ name: f.name.split('/').pop(), url: URL.createObjectURL(blob) });
      }
      if (!state.images.length) { setStatus('ZIP内に画像が見つかりませんでした'); return; }
      $('btn-reset-all').style.display = 'inline-flex';
      const saved = loadFromStorage();
      const resumed = restoreSession(saved);
      updateAll();
      if (!resumed) setStatus(`${state.images.length}枚の画像を読み込みました`);
    } catch(e) { setStatus('ZIPの読み込みに失敗しました: ' + e.message); }
    this.value = '';
  };

  $('btn-load-excel').onclick = () => $('excel-input').click();
  $('excel-input').onchange = function() {
    const file = this.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, {header:1});
        state.prompts = {};
        data.forEach(row => {
          if (row[0] !== undefined && row[1] !== undefined)
            state.prompts[row[0]] = String(row[1]);
        });
        setStatus(`${Object.keys(state.prompts).length}件のプロンプトを読み込みました`);
        saveToStorage(); updateAll();
      } catch(ex) { setStatus('Excel読み込みエラー: ' + ex.message); }
    };
    reader.readAsArrayBuffer(file);
    this.value = '';
  };

  $('btn-ok').onclick = () => setScore('ok');
  $('btn-ng').onclick = () => setScore('ng');
  $('btn-save').onclick = saveResults;
  $('nav-prev').onclick = () => navigate(-1);
  $('nav-next').onclick = () => navigate(1);
  $('btn-cancel-reset').onclick = () => { state.pendingReset = false; hideBanner(); updateSidebar(); };
  $('btn-reset-all').onclick = () => {
    if (confirm('全ての採点データをリセットしますか？')) {
      state.scores = {}; state.current = 0;
      state.pendingReset = false; hideBanner();
      localStorage.removeItem(STORE_KEY);
      setStatus('全リセットしました'); updateAll();
    }
  };

  document.querySelectorAll('.batch-btn').forEach(btn => {
    btn.onclick = function() {
      document.querySelectorAll('.batch-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      state.batchCount = +this.dataset.val;
      saveToStorage();
    };
  });

  document.addEventListener('keydown', e => {
    if (['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)) return;
    switch(e.key.toLowerCase()) {
      case 'o': setScore('ok'); break;
      case 'n': case 'x': setScore('ng'); break;
      case 'arrowleft': navigate(-1); break;
      case 'arrowright': navigate(1); break;
      case 's': if (e.metaKey || e.ctrlKey) { e.preventDefault(); saveResults(); } break;
    }
  });
  </script>
  </body>
  </html>
