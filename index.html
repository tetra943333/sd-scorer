<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SD プロンプト採点</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
<style>
:root {
  --bg: #0f0f11;
  --bg2: #18181c;
  --bg3: #222228;
  --border: rgba(255,255,255,.08);
  --text: #e8e8ec;
  --text2: #888896;
  --text3: #555562;
  --ok: #4ade80;
  --ok-bg: rgba(74,222,128,.12);
  --ok-border: rgba(74,222,128,.35);
  --ng: #f87171;
  --ng-bg: rgba(248,113,113,.12);
  --ng-border: rgba(248,113,113,.35);
  --accent: #7c6fe0;
  --accent2: #a78bfa;
  --warn: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

/* ===== MAIN LAYOUT ===== */
.app { display: flex; height: 100vh; height: 100dvh; }
.viewer-main {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  overflow: hidden;
}
.viewer-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
}
.placeholder {
  color: var(--text3);
  font-size: 14px;
  text-align: center;
  width: 100%;
  padding: 20px;
}
.placeholder .ti { font-size: 48px; display: block; margin-bottom: 12px; opacity: .3; }

/* ===== HEADER OVERLAY ===== */
.header-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  z-index: 10;
  background: linear-gradient(180deg, rgba(0,0,0,.4) 0%, transparent 100%);
}
.menu-btn {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  border: none;
  background: rgba(255,255,255,.08);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  transition: all .15s;
  backdrop-filter: blur(8px);
}
.menu-btn:active { background: rgba(255,255,255,.15); }
.img-counter {
  font-size: 12px;
  color: var(--text);
  background: rgba(0,0,0,.5);
  padding: 4px 12px;
  border-radius: 20px;
  backdrop-filter: blur(8px);
  white-space: nowrap;
}

/* ===== ACTION BUTTONS OVERLAY ===== */
.action-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 20px 16px;
  z-index: 10;
  background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.5) 100%);
  pointer-events: none;
}
.action-overlay > button { pointer-events: auto; }

.verdict-circle {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 2px solid;
  background: rgba(0,0,0,.4);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  transition: all .2s;
  backdrop-filter: blur(8px);
}
.verdict-circle.ok {
  border-color: var(--ok);
  color: var(--ok);
}
.verdict-circle.ok:active {
  background: var(--ok-bg);
  transform: scale(1.1);
}
.verdict-circle.ng {
  border-color: var(--ng);
  color: var(--ng);
}
.verdict-circle.ng:active {
  background: var(--ng-bg);
  transform: scale(1.1);
}

/* ===== SWIPE INDICATOR ===== */
.swipe-hint {
  position: absolute;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: rgba(255,255,255,.4);
  text-align: center;
  opacity: 0;
  animation: fadeInOut 3s ease-in-out;
  z-index: 5;
}
@keyframes fadeInOut {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; }
}

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  width: 320px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: translateX(-100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  z-index: 100;
  box-shadow: 2px 0 20px rgba(0,0,0,.5);
}
.sidebar.open { transform: translateX(0); }
.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-header h2 {
  font-size: 15px;
  font-weight: 600;
  background: linear-gradient(135deg, var(--accent2), #60a5fa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.close-btn {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  border: none;
  background: var(--bg3);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
.sidebar-content {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.section {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.label {
  font-size: 10px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 7px;
  font-weight: 600;
}
.prompt-box {
  font-size: 11px;
  line-height: 1.65;
  color: var(--text2);
  background: var(--bg3);
  border-radius: 6px;
  padding: 9px;
  max-height: 90px;
  overflow-y: auto;
  word-break: break-word;
  border: 1px solid var(--border);
}
.prompt-box.empty {
  color: var(--text3);
  font-style: italic;
}
.batch-btns {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.batch-btn {
  width: 40px;
  height: 32px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg3);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  font-family: inherit;
  transition: all .15s;
}
.batch-btn.active {
  background: linear-gradient(135deg, var(--accent), #5b8dee);
  border-color: transparent;
  color: #fff;
}
.results-wrap {
  flex: 1;
  overflow-y: auto;
}
.rtable {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
}
.rtable th {
  text-align: left;
  padding: 5px 8px;
  border-bottom: 1px solid var(--border);
  color: var(--text3);
  font-weight: 500;
  position: sticky;
  top: 0;
  background: var(--bg2);
}
.rtable td {
  padding: 4px 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  word-break: break-word;
}
.rtable tr.current td { background: rgba(124,111,224,.08); }
.tag-ok {
  color: var(--ok);
  background: var(--ok-bg);
  padding: 1px 7px;
  border-radius: 20px;
  font-size: 10px;
  border: 1px solid var(--ok-border);
}
.tag-ng {
  color: var(--ng);
  background: var(--ng-bg);
  padding: 1px 7px;
  border-radius: 20px;
  font-size: 10px;
  border: 1px solid var(--ng-border);
}
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
}
.stat-card {
  background: var(--bg3);
  border-radius: 6px;
  padding: 7px 8px;
  text-align: center;
  border: 1px solid var(--border);
}
.stat-val {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent2), #60a5fa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.stat-lbl {
  font-size: 10px;
  color: var(--text3);
  margin-top: 1px;
}

.btn {
  padding: 6px 12px;
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg3);
  color: var(--text);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  font-family: inherit;
  transition: all .15s;
}
.btn:active { background: rgba(255,255,255,.08); }
.btn-primary {
  background: linear-gradient(135deg, var(--accent), #5b8dee);
  border-color: transparent;
  color: #fff;
}
.btn-warn {
  background: rgba(245,158,11,.15);
  border-color: rgba(245,158,11,.4);
  color: var(--warn);
}

/* ===== OVERLAY BACKDROP ===== */
.overlay-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 99;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}
.overlay-bg.show {
  opacity: 1;
  pointer-events: auto;
}

/* ===== STATUS ===== */
.status-bar {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font-size: 11px;
  color: var(--text3);
  background: rgba(0,0,0,.6);
  padding: 6px 10px;
  border-radius: 20px;
  backdrop-filter: blur(8px);
  max-width: 200px;
  text-align: right;
  z-index: 8;
}
.autosave-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--ok);
  display: inline-block;
  margin-right: 5px;
  opacity: 0;
  transition: opacity .3s;
}
.autosave-dot.show { opacity: 1; }

/* ===== MOBILE ===== */
@media (max-width: 640px) {
  .sidebar { width: 100%; }
}
</style>
</head>
<body>
<div class="app">
  <div class="viewer-main" id="viewer-main">
    <div class="placeholder">
      <span class="ti ti-photo-off"></span>
      ZIPファイルを読み込んでください
    </div>
  </div>
  <div class="swipe-hint" id="swipe-hint">左右にスワイプまたはクリック</div>
</div>

<!-- HEADER OVERLAY -->
<div class="header-overlay">
  <button class="menu-btn" id="menu-btn" title="メニューを開く"><i class="ti ti-menu-2"></i></button>
  <div class="img-counter" id="img-counter" style="display:none"></div>
</div>

<!-- ACTION OVERLAY -->
<div class="action-overlay">
  <button class="verdict-circle ng" id="btn-ng-circle" title="NG (N キー)"><i class="ti ti-circle-x"></i></button>
  <button class="verdict-circle ok" id="btn-ok-circle" title="OK (O キー)"><i class="ti ti-circle-check"></i></button>
</div>

<!-- SIDEBAR -->
<div class="overlay-bg" id="overlay-bg"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>✦ SD採点</h2>
    <button class="close-btn" id="close-btn"><i class="ti ti-x"></i></button>
  </div>

  <div class="sidebar-content">
    <div class="section">
      <div class="label">プロンプト</div>
      <div class="prompt-box empty" id="prompt-display">画像を読み込むと表示されます</div>
    </div>

    <div class="section">
      <div class="label">バッチカウント</div>
      <div class="batch-btns">
        <button class="batch-btn active" data-val="1">1</button>
        <button class="batch-btn" data-val="2">2</button>
        <button class="batch-btn" data-val="4">4</button>
        <button class="batch-btn" data-val="8">8</button>
        <button class="batch-btn" data-val="16">16</button>
      </div>
    </div>

    <div class="section">
      <button class="btn" id="btn-load-zip"><i class="ti ti-file-zip"></i>ZIP読み込み</button>
      <button class="btn" id="btn-load-excel" style="margin-top:6px"><i class="ti ti-table"></i>Excel読み込み</button>
      <button class="btn btn-primary" id="btn-save" style="margin-top:6px;width:100%"><i class="ti ti-download"></i>結果を保存</button>
      <button class="btn btn-warn" id="btn-reset-all" style="margin-top:6px;width:100%;display:none"><i class="ti ti-trash"></i>全リセット</button>
    </div>

    <div class="section" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div class="label">採点済みリスト</div>
      <div class="results-wrap">
        <div id="results-area" style="font-size:11px;color:var(--text3)">まだ採点されていません</div>
      </div>
    </div>

    <div class="section">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-val" id="stat-total">0</div><div class="stat-lbl">総数</div></div>
        <div class="stat-card"><div class="stat-val" id="stat-scored">0</div><div class="stat-lbl">採点済み</div></div>
        <div class="stat-card"><div class="stat-val" id="stat-ng-pct">-</div><div class="stat-lbl">NG率</div></div>
      </div>
    </div>
  </div>
</div>

<div class="status-bar" id="status-bar">
  <span class="autosave-dot" id="autosave-dot"></span><span id="status-msg">ファイル読込待機</span>
</div>

<input type="file" id="zip-input" accept=".zip" style="display:none">
<input type="file" id="excel-input" accept=".xlsx,.xls,.csv" style="display:none">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
const STORE_KEY = 'sd_scorer_v5_fixed';
const $ = id => document.getElementById(id);

const state = {
  images: [], current: 0, prompts: {}, scores: {},
  batchCount: 1, zipName: '', pendingReset: false,
  touchStartX: 0, touchStartTime: 0
};

/* ---- SIDEBAR TOGGLE ---- */
$('menu-btn').onclick = () => {
  $('sidebar').classList.add('open');
  $('overlay-bg').classList.add('show');
};
$('close-btn').onclick = $('overlay-bg').onclick = () => {
  $('sidebar').classList.remove('open');
  $('overlay-bg').classList.remove('show');
};

/* ---- STORAGE ---- */
function saveToStorage() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      scores: state.scores, batchCount: state.batchCount,
      current: state.current, zipName: state.zipName,
      imageNames: state.images.map(i => i.name),
      prompts: state.prompts
    }));
    const dot = $('autosave-dot');
    dot.classList.add('show');
    setTimeout(() => dot.classList.remove('show'), 1800);
  } catch(e) {}
}

function loadFromStorage() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e) { return null; }
}

function restoreSession(saved) {
  if (!saved || !state.images.length) return false;
  const match = saved.imageNames && saved.imageNames.length === state.images.length &&
    saved.imageNames.every((n,i) => n === state.images[i].name);
  if (!match) return false;
  state.scores = saved.scores || {};
  if (!Object.keys(state.prompts).length && saved.prompts) state.prompts = saved.prompts;
  state.batchCount = saved.batchCount || 1;
  document.querySelectorAll('.batch-btn').forEach(b =>
    b.classList.toggle('active', +b.dataset.val === state.batchCount));
  const firstUnscored = state.images.findIndex((_,i) => state.scores[i] === undefined);
  state.current = firstUnscored >= 0 ? firstUnscored : state.images.length - 1;
  setStatus(`前回の続きから再開 (${Object.keys(state.scores).length}/${state.images.length})`);
  return true;
}

/* ---- SCORE LOGIC ---- */
function hasScoreAfter(idx) {
  for (let i = idx + 1; i < state.images.length; i++) {
    if (state.scores[i] !== undefined) return true;
  }
  return false;
}

function setScore(verdict) {
  if (!state.images.length) return;
  if (hasScoreAfter(state.current) && !state.pendingReset) {
    state.pendingReset = true;
    if (confirm('この画像以降のスコアがリセットされます。\nよろしいですか？')) {
      resetFrom(state.current);
      applyScore(verdict);
    } else {
      state.pendingReset = false;
    }
    return;
  }
  applyScore(verdict);
}

function applyScore(verdict) {
  state.pendingReset = false;
  state.scores[state.current] = verdict;
  saveToStorage();
  updateAll();
  setTimeout(() => navigate(1), 150);
}

function resetFrom(idx) {
  for (let i = idx; i < state.images.length; i++) delete state.scores[i];
  saveToStorage();
  updateAll();
}

function navigate(dir) {
  if (!state.images.length) return;
  const next = Math.max(0, Math.min(state.images.length - 1, state.current + dir));
  if (next === state.current) return;
  state.current = next;
  updateAll();
}

/* ---- RENDER ---- */
function updateViewer() {
  const main = $('viewer-main');
  if (!state.images.length) {
    main.innerHTML = '<div class="placeholder"><span class="ti ti-photo-off"></span>ZIPファイルを読み込んでください</div>';
    $('img-counter').style.display = 'none';
    return;
  }
  let el = main.querySelector('img');
  if (!el) {
    main.innerHTML = '';
    el = document.createElement('img');
    el.className = 'viewer-img';
    main.appendChild(el);
  }
  const img = state.images[state.current];
  el.src = img.url;
  el.alt = img.name;
  $('img-counter').textContent = `${state.current + 1} / ${state.images.length}`;
  $('img-counter').style.display = 'block';
}

function updateSidebar() {
  if (!state.images.length) return;
  const idx = state.current;
  const pd = $('prompt-display');
  // ★ FIX: 画像インデックスから計算したプロンプト番号（1始まり）でアクセス
  const promptIdx = idx + 1;
  const p = state.prompts[promptIdx];
  if (p) { pd.textContent = p; pd.classList.remove('empty'); }
  else { pd.textContent = 'プロンプトが見つかりません'; pd.classList.add('empty'); }
}

function updateStats() {
  const entries = Object.values(state.scores);
  const ng = entries.filter(v => v === 'ng').length;
  $('stat-total').textContent = state.images.length;
  $('stat-scored').textContent = entries.length;
  $('stat-ng-pct').textContent = entries.length > 0 ? Math.round(ng / entries.length * 100) + '%' : '-';
}

function updateResultsTable() {
  const area = $('results-area');
  const entries = Object.entries(state.scores);
  if (!entries.length) {
    area.innerHTML = '<div style="color:var(--text3);font-size:11px">まだ採点されていません</div>';
    return;
  }
  const rows = entries.sort((a,b) => +a[0] - +b[0]).map(([i, v]) => {
    const imgIdx = +i;
    const promptIdx = imgIdx + 1;  // ★ FIX: 1始まりのプロンプト番号
    const p = state.prompts[promptIdx] || '-';
    const short = p.length > 45 ? p.slice(0, 45) + '…' : p;
    const isCurrent = imgIdx === state.current ? 'current' : '';
    const tag = v === 'ok' ? '<span class="tag-ok">OK</span>' : '<span class="tag-ng">NG</span>';
    return `<tr class="${isCurrent}"><td style="color:var(--text3);min-width:22px">#${promptIdx}</td><td style="max-width:140px">${short}</td><td>${tag}</td></tr>`;
  }).join('');
  area.innerHTML = `<table class="rtable"><thead><tr><th>#</th><th>プロンプト</th><th>結果</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function updateAll() { updateViewer(); updateSidebar(); updateStats(); updateResultsTable(); }
function setStatus(msg) { $('status-msg').textContent = msg; }

/* ---- SAVE EXCEL ---- */
function saveResults() {
  if (!Object.keys(state.scores).length) { setStatus('採点データがありません'); return; }
  const grouped = {};
  Object.entries(state.scores).forEach(([i, v]) => {
    const imgIdx = +i;
    const promptIdx = imgIdx + 1;  // ★ FIX: 1始まりのプロンプト番号
    const p = state.prompts[promptIdx] || '';
    const grp = Math.floor(imgIdx / state.batchCount);
    if (!grouped[grp]) grouped[grp] = { seq: grp + 1, prompt: p, total: 0, ng: 0 };
    grouped[grp].total++;
    if (v === 'ng') grouped[grp].ng++;
  });
  const rows = [['#', 'プロンプト', 'NG率', 'NG数', '総数']];
  Object.values(grouped).sort((a,b) => a.seq - b.seq).forEach(g => {
    rows.push([g.seq, g.prompt, g.total > 0 ? Math.round(g.ng / g.total * 100) + '%' : '-', g.ng, g.total]);
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:4},{wch:60},{wch:8},{wch:6},{wch:6}];
  XLSX.utils.book_append_sheet(wb, ws, '採点結果');
  const fname = (state.zipName || 'results').replace(/\.zip$/i,'') + '_scores.xlsx';
  XLSX.writeFile(wb, fname, { bookType: 'xlsx', type: 'binary' });
  setStatus('保存: ' + fname);
}

/* ---- FILE INPUTS ---- */
$('btn-load-zip').onclick = () => $('zip-input').click();
$('zip-input').onchange = async function() {
  const file = this.files[0]; if (!file) return;
  setStatus('ZIPを読み込み中...');
  state.zipName = file.name;
  state.images.forEach(i => URL.revokeObjectURL(i.url));
  state.images = []; state.scores = {}; state.current = 0; state.pendingReset = false;
  try {
    const zip = await JSZip.loadAsync(file);
    const imgExts = /\.(png|jpe?g|gif|webp)$/i;
    const files = Object.values(zip.files)
      .filter(f => !f.dir && imgExts.test(f.name))
      .sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true}));
    for (const f of files) {
      const blob = await f.async('blob');
      state.images.push({ name: f.name.split('/').pop(), url: URL.createObjectURL(blob) });
    }
    if (!state.images.length) { setStatus('ZIP内に画像が見つかりませんでした'); return; }
    $('btn-reset-all').style.display = 'inline-flex';
    const saved = loadFromStorage();
    const resumed = restoreSession(saved);
    updateAll();
    if (!resumed) setStatus(`${state.images.length}枚の画像を読み込みました`);
    $('sidebar').classList.remove('open');
    $('overlay-bg').classList.remove('show');
  } catch(e) { setStatus('ZIPの読み込みに失敗しました'); }
  this.value = '';
};

$('btn-load-excel').onclick = () => $('excel-input').click();
$('excel-input').onchange = function() {
  const file = this.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, {header:1});
      state.prompts = {};
      data.forEach(row => {
        if (row[0] !== undefined && row[1] !== undefined) {
          // ★ FIX: キーを整数に統一（1.0 → 1 に統一）
          const key = Math.round(Number(row[0]));
          state.prompts[key] = String(row[1]);
        }
      });
      setStatus(`${Object.keys(state.prompts).length}件のプロンプトを読み込みました`);
      saveToStorage(); updateAll();
    } catch(ex) { setStatus('Excel読み込みエラー'); }
  };
  reader.readAsArrayBuffer(file);
  this.value = '';
};

$('btn-ok-circle').onclick = () => setScore('ok');
$('btn-ng-circle').onclick = () => setScore('ng');
$('btn-save').onclick = saveResults;
$('btn-reset-all').onclick = () => {
  if (confirm('全ての採点データをリセットしますか？')) {
    state.scores = {}; state.current = 0;
    localStorage.removeItem(STORE_KEY);
    setStatus('全リセットしました'); updateAll();
  }
};

document.querySelectorAll('.batch-btn').forEach(btn => {
  btn.onclick = function() {
    document.querySelectorAll('.batch-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    state.batchCount = +this.dataset.val;
    saveToStorage();
  };
});

/* ---- KEYBOARD ---- */
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  switch(e.key.toLowerCase()) {
    case 'o': setScore('ok'); break;
    case 'n': case 'x': setScore('ng'); break;
    case 'arrowleft': navigate(-1); break;
    case 'arrowright': navigate(1); break;
    case 's': if (e.metaKey || e.ctrlKey) { e.preventDefault(); saveResults(); } break;
  }
});

/* ---- SWIPE / CLICK ---- */
const main = $('viewer-main');
main.addEventListener('touchstart', e => {
  state.touchStartX = e.touches[0].clientX;
  state.touchStartTime = Date.now();
});
main.addEventListener('touchend', e => {
  const endX = e.changedTouches[0].clientX;
  const diff = state.touchStartX - endX;
  const time = Date.now() - state.touchStartTime;
  if (time < 300 && Math.abs(diff) > 40) {
    if (diff > 0) setScore('ok');
    else setScore('ng');
  }
});
main.addEventListener('click', e => {
  const rect = main.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const third = rect.width / 3;
  if (x < third) setScore('ng');
  else if (x > rect.width - third) setScore('ok');
});
</script>
